name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Spec 23.1: a short calibration run checks a subset of metrics against wide bands.
      - run: npm run calibrate -- --seasons 20 --ci --out test-results/calibration
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run layout
        env:
          GM_REQUIRE_WEBKIT: '1'
          GM_SKIP_BUILD: '1'
      # A failed layout test's page snapshot, in the log where it can be read.
      - name: Show failed layout tests' page snapshots
        if: failure()
        run: find test-results -name error-context.md -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
